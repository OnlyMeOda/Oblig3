<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kitchen Crew</title>
<link rel="stylesheet" href="style.css">
<script>
try { var th = localStorage.getItem('kitchen-crew-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
</script>
</head>
<body>
<main>
  <div class="hero">
    <div>
      <h1>🍳 Kitchen Crew</h1>
      <div id="week" aria-live="polite"></div>
    </div>
    <div class="row">
      <button id="theme" aria-pressed="false"></button>
      <button class="primary" id="reroll">🎲 Reroll next week</button>
    </div>
  </div>

  <div class="quote" id="quote" role="status" aria-live="polite"></div>
  <div class="quote ask" id="ask" role="alertdialog" aria-label="Please confirm" hidden>
    <span id="asktxt"></span>
    <span class="row inline">
      <button class="primary" id="askyes">Yes</button>
      <button id="askno">Cancel</button>
    </span>
  </div>

  <section aria-labelledby="h-tasks">
    <h2 id="h-tasks">This week’s duties</h2>
    <div class="grid" id="tasks"></div>
    <form class="row spaced panel" id="taskf">
      <div class="field grow">
        <label for="tn">Duty name</label>
        <input id="tn" maxlength="30" placeholder="e.g. Wipe the table" autocomplete="off" required>
      </div>
      <div class="field">
      <label for="te">Icon</label>
      <select id="te">
        <option value="✨">✨ Sparkle</option>
        <option value="🍽️">🍽️ Plates</option>
        <option value="🧽">🧽 Sponge</option>
        <option value="🧹">🧹 Broom</option>
        <option value="🧺">🧺 Laundry</option>
        <option value="🧴">🧴 Soap</option>
        <option value="🗑️">🗑️ Trash</option>
        <option value="♻️">♻️ Recycling</option>
        <option value="🍌">🍌 Food waste</option>
        <option value="🧊">🧊 Fridge</option>
        <option value="🔥">🔥 Stove</option>
        <option value="🍳">🍳 Pans</option>
        <option value="🥫">🥫 Pantry</option>
        <option value="🪴">🪴 Plants</option>
        <option value="🛒">🛒 Groceries</option>
        <option value="🪟">🪟 Windows</option>
        <option value="🚪">🚪 Door</option>
        <option value="📦">📦 Boxes</option>
        <option value="☕">☕ Coffee machine</option>
      </select>
      </div>
      <div class="field">
      <label for="tp">Points</label>
      <select id="tp">
        <option value="1">1 pt</option>
        <option value="2" selected>2 pts</option>
        <option value="3">3 pts</option>
        <option value="4">4 pts</option>
        <option value="5">5 pts</option>
      </select>
      </div>
      <button class="primary" type="submit">Add duty</button>
    </form>
  </section>

  <section aria-labelledby="h-board">
    <h2 id="h-board">🏆 Scoreboard</h2>
    <ol class="board" id="board"></ol>
  </section>

  <section aria-labelledby="h-crew">
    <h2 id="h-crew">The crew</h2>
    <div class="row" id="crew"></div>
    <form class="row spaced panel" id="addf">
      <div class="field grow">
        <label for="nm">Housemate name</label>
        <input id="nm" maxlength="14" placeholder="e.g. Jamie" autocomplete="off">
      </div>
      <button class="primary" type="submit">Add housemate</button>
    </form>
  </section>

  <section><button id="reset">Start over</button></section>
</main>
<script src="app.js"></script>
</body>
</html>
